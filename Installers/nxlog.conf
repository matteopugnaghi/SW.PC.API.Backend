## NXLog Configuration file for CAM CSP v2.10
## + SCADA Aquafrisch JSONL Logs (L1 Audit + L2 Operations)
## See the nxlog reference manual about the configuration options
## Version used:nxlog-ce-3.2.2329


define ROOT C:\Program Files (x86)\nxlog
#define include %ROOT%\conf\\*.local.conf
define CERTDIR  %ROOT%\cert
define CONFDIR  %ROOT%\conf
define LOGDIR   %ROOT%\data
define LOGFILE  %LOGDIR%\nxlog.log
LogFile %LOGFILE%


Moduledir %ROOT%\modules
CacheDir  %ROOT%\data
Pidfile   %ROOT%\data\nxlog.pid
SpoolDir  %ROOT%\data

<Extension json>
    Module      xm_json
</Extension>

<Extension xml>
    Module      xm_xml
</Extension>

<Extension syslog>
    Module      xm_syslog
</Extension>

<Extension gelf>
    Module        xm_gelf
</Extension>

<Extension charconv>
    Module      xm_charconv
    AutodetectCharsets iso8859-2, utf-8, utf-16, utf-32
</Extension>
<Extension exec>
    Module      xm_exec
</Extension>
<Extension fileop>
    Module      xm_fileop
</Extension>

## ═══════════════════════════════════════════════════════════
## Windows Event Logs (original CAM CSP)
## ═══════════════════════════════════════════════════════════
<Input eventlog>
    Module      im_msvistalog
    <QueryXML>
        <QueryList>
            <Query Id='0'>
            <Select Path='Application'>*</Select>
            <Select Path='Security'>*</Select>
            <Select Path='System'>*</Select>
            <Select Path='ForwardedEvents'>*</Select>
            <Select Path="Windows PowerShell">*</Select>
            <Select Path="Key Management Service">*</Select>
            <Select Path="Microsoft-Windows-Bits-Client/Operational">*</Select>
            <Select Path="Microsoft-Windows-CodeIntegrity/Operational">*</Select>
            <Select Path="Microsoft-Windows-DriverFrameworks-UserMode/Operational">*</Select>
            <Select Path="Microsoft-Windows-GroupPolicy/Operational">*</Select>
            <Select Path="Microsoft-Windows-NTLM/Operational">*</Select>
            <Select Path="Microsoft-Windows-NetworkProfile/Operational">*</Select>
            <Select Path="Microsoft-Windows-PowerShell/Operational">*</Select>
            <Select Path="Microsoft-Windows-Security-Audit-Configuration-Client/Operational">*</Select>
            <Select Path="Microsoft-Windows-TaskScheduler/Operational">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-ClientUSBDevices/Admin">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-ClientUSBDevices/Operational">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-LocalSessionManager/Admin">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-LocalSessionManager/Operational">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-PnPDevices/Admin">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-PnPDevices/Operational">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-RemoteConnectionManager/Admin">*</Select>
            <Select Path="Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational">*</Select>
            <Select Path="Microsoft-Windows-Windows Firewall With Advanced Security/Firewall">*</Select>
            <Select Path="Microsoft-Windows-WindowsUpdateClient/Operational">*</Select>
            <Select Path="Microsoft-Windows-Wired-AutoConfig/Operational">*</Select>
            <Select Path="Microsoft-Windows-Windows Defender/Operational">*</Select>
            <Select Path="Microsoft-Windows-Windows Defender/WHC">*</Select>
            </Query>
        </QueryList>
    </QueryXML>
    Exec        convert_fields("AUTO", "utf-8");
</Input>

## ═══════════════════════════════════════════════════════════
## Windows Firewall Log (original CAM CSP)
## ═══════════════════════════════════════════════════════════
<Input WinFirewallLog>
   Module   im_file
   File     "C:\\Windows\\System32\\LogFiles\\Firewall\\pfirewall.log"
   Exec $SourceName = 'pfirewall' ;
   Exec convert_fields("AUTO", "utf-8");
</Input>

## ═══════════════════════════════════════════════════════════
## SCADA Aquafrisch - L1 Audit Logs (JSONL)
## Eventos de seguridad: login, logout, cambios config, etc.
## TLS_M3_ALS_EXI_CYB_SYS_00510 / 00516
## ═══════════════════════════════════════════════════════════
<Input scada_audit>
    Module      im_file
    File        "C:\\Aquafrisch Supervisor\\Backend\\Projects\\A72.TOUTWP\\logs\\audit_*.log"
    ReadFromLast TRUE
    SavePos     TRUE
    InputType   LineBased
    Exec        parse_json();
    Exec        $SourceName = 'scada-audit';
</Input>

## ═══════════════════════════════════════════════════════════
## SCADA Aquafrisch - L2 Operation Logs (JSONL)
## Eventos operacionales: alarmas PLC, recetas, comandos
## ═══════════════════════════════════════════════════════════
<Input scada_ops>
    Module      im_file
    File        "C:\\Aquafrisch Supervisor\\Backend\\Projects\\A72.TOUTWP\\logs\\operations_*.log"
    ReadFromLast TRUE
    SavePos     TRUE
    InputType   LineBased
    Exec        parse_json();
    Exec        $SourceName = 'scada-operations';
</Input>

## ═══════════════════════════════════════════════════════════
## OUTPUT: SOC PIVOT TISSEO - Syslog SNARE (UDP 5613)
## ═══════════════════════════════════════════════════════════
<Output out_syslog_snare>
    Module      om_udp
    host        10.2.7.78
    Port        5613
    Exec        to_syslog_snare();
</Output>

## ═══════════════════════════════════════════════════════════
## OUTPUT: SOC PIVOT TISSEO - GELF (UDP 5615)
## ═══════════════════════════════════════════════════════════
<Output out_gelf>
    Module      om_udp
    host        10.2.7.78
    Port        5615
    OutputType  GELF
</Output>

## ═══════════════════════════════════════════════════════════
## OUTPUT: TEST → PC desarrollo 192.168.2.151 (TEMPORAL)
## Quitar este bloque cuando termine el test
## ═══════════════════════════════════════════════════════════
<Output out_gelf_test>
    Module      om_udp
    host        192.168.2.151
    Port        5615
    OutputType  GELF
</Output>

## ═══════════════════════════════════════════════════════════
## ROUTES
## ═══════════════════════════════════════════════════════════

## Windows Events → SOC PIVOT (Syslog SNARE + GELF)
<Route windows_snare>
    Path        eventlog => out_syslog_snare
</Route>

<Route windows_gelf>
    Path        eventlog => out_gelf
</Route>

## SCADA Logs → SOC PIVOT (Syslog SNARE + GELF)
<Route scada_snare>
    Path        scada_audit, scada_ops => out_syslog_snare
</Route>

<Route scada_gelf>
    Path        scada_audit, scada_ops => out_gelf
</Route>

## TEST → PC desarrollo (TEMPORAL - quitar cuando termine el test)
<Route test>
    Path        eventlog, scada_audit, scada_ops => out_gelf_test
</Route>
